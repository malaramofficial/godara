name: Build MeraPanchang APK

on:
  push:
    paths:
      - 'MeraPanchang-AndroidStudio.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          if [ -f MeraPanchang-AndroidStudio.zip ]; then
            unzip -o MeraPanchang-AndroidStudio.zip -d .
          fi
          test -f MeraPanchang/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: MeraPanchang
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeraPanchang-debug-apk
          path: MeraPanchang/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
